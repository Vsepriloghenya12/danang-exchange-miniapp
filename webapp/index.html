<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

    <!-- App icon (easy to replace): webapp/public/brand/app-icon.png -->
    <link rel="icon" type="image/png" href="/brand/app-icon.png?v=28" />
    <link rel="apple-touch-icon" href="/brand/app-icon.png?v=28" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0C1218" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload key images so they appear instantly in Telegram WebView -->
    <link rel="preload" as="image" href="/brand/main-logo-light.png?v31-light" fetchpriority="high" />
    <link rel="preload" as="image" href="/brand/main-logo-dark.png?v31-dark" fetchpriority="high" />

    <title>Обмен валют — Дананг</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search || "");
          var queryLang = String(params.get("lang") || "").toLowerCase();
          var storedLang = String(localStorage.getItem("mx_lang") || "").toLowerCase();
          var effective = queryLang === "en" || queryLang === "ru" ? queryLang : storedLang === "en" ? "en" : "ru";
          if (queryLang === "en" || queryLang === "ru") localStorage.setItem("mx_lang", queryLang);
          document.documentElement.setAttribute("lang", effective);
        } catch (e) {}
      })();
    </script>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var theme = String(localStorage.getItem("mx_theme") || "").toLowerCase() === "dark" ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body style="background:#0c1218;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx?v=redesign-1"></script>
  </body>
</html>
